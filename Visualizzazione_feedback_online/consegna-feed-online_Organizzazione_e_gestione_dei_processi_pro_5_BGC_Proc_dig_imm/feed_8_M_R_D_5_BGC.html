tto alla funzione richiesta."},{"idx":3,"text":"Spiega il concetto di user experience.","open":true,"options":[],"answer":"La User experience, si basa sull'esperienza dell'utente, di come esso interagisce come si comporta e i sui pensieri o criticita relativi all'uso di un sito, questa esperienza ed informazioni sono di vitale importanza allo UX Design il quale ricaverà la miglior sitemap e piano di studio da mandare allo UI in modo che crei un'interfaccia agevole per l'utente","correct":"","score":2,"feedback":"La risposta coglie il nucleo centrale della user experience come esperienza d’uso dell’utente e sottolinea l’importanza dell’interazione con il sito. Tuttavia si allontana in parte dalla definizione richiesta, aggiungendo ruoli progettuali non necessari, mentre manca una formulazione chiara della user experience come funzionalità e naturalezza di utilizzo delle pagine."},{"idx":4,"text":"Descrivi il ruolo del W3C.","open":true,"options":[],"answer":"Il W3C (World Wide Web Consortium) sono una serie di aziende in campo informatico (circa 300) che insieme formano un consorzio e si occupano della gestione e dell'aprovazione di un sito in rete, affinche esso rispetti le normative internazionali infatti loro si assicurano che il codice Html sia adatto a tutti i client (Browser) es: Firefox, Chrome, Opera... a finche l'interfaccia grafica o la parte testuale non campi ma resti invariata","correct":"","score":2.5,"feedback":"La risposta è corretta e completa nei nuclei essenziali. Identifica il W3C come consorzio, ne riconosce il compito di stabilire standard per il web e collega correttamente la validazione alla conformità del codice e alla corretta visualizzazione nei diversi browser. Restano solo lievi imprecisioni formali che non compromettono la comprensione."},{"idx":5,"text":"Descrivi cosa si intende per landing page.","open":true,"options":[],"answer":"La Landing Page è la pagina di arrivo di un utente su un sito, essa di solito contiene l'Header ovvero la word di accesso","C. Protocollo HTTP","D. Browser"],"answer":"A. Indirizzo IP","correct":"A. Indirizzo IP","score":"","feedback":""},{"idx":15,"text":"Qual Ã¨ una funzione dei social rispetto al sito web?","open":false,"options":["A. Veicolare traffico verso il sito","B. Sostituire definitivamente il sito","C. Eliminare il marketing","D. Bloccare le campagne pubblicitarie"],"answer":"A. Veicolare traffico verso il sito","correct":"A. Veicolare traffico verso il sito","score":"","feedback":""}];
