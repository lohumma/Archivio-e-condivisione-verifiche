    const questions = [{"idx":1,"text":"Descrivi cosa si intende per landing page.","open":true,"options":[],"answer":"Come dice il termine è la pagina di atterraggio di un sito. Una volta aperta, vedremo le informazioni principali e i contenuti. Ci si arriva da uno sito generico per andare nello specifico. Può rappresentare anche una pagina esclusiva in modo da far sentire l'utente parte di un élite. ","correct":"","score":1,"feedback":"La risposta contiene il concetto generale di pagina di atterraggio, ma non esplicita con precisione la sua funzione come punto di approdo di una campagna pubblicitaria. Corretto, ma troppo sintetico."},{"idx":2,"text":"Descrivi il ruolo del W3C.","open":true,"options":[],"answer":"W3C è il World Wide Web Consortium. è un consorzio che stabilisce gli standard del web.\nValutare il sito significa assicurarsi che risponda agli standard internazionali. Solo in questo modo sarà possibile la lettura del sito da parte dei browser. ","correct":"","score":2,"feedback":"La risposta è corretta nei nuclei principali: identifica il W3C come consorzio e ne riconosce il compito di definire standard per il web. La spiegazione però non è completa, perché manca il riferimento all’uniformazione dei linguaggi e al problema delle diverse interpretazioni da parte dei browser."},{"idx":3,"text":"Descrivi la nascita del World Wide Web.","open":true,"options":[],"answer":"La rete ha avuto uno sviluppo periodico. \nSolo nel 1950 arriva la nascita dei primi computer.  \nNel 1960 viene creata Apharneth, la prima rete che collegava più dispositivi, ovvero quelli dei ricercatori universitari scientifici. \nNel 1990 nasce il world wide web, inventato da Tim Berners-Leen (creatore anche dell'Http).\nDa qua in poi lo sviluppo si velocizza radicalmente: nel 1991 Berners-Leen crea il primo sito web. \nNel 1994 i siti presenti sul web erano 3000, fino ad arrivare al 2020, in cui sono presenti miliardi di siti sul web.","correct":"","score":2,"feedback":"La risposta ricostruisce in parte la nascita del web e cita diversi passaggi cronologici corretti, ma contiene anche imprecisioni rilevanti nei nomi e in alcuni riferimenti storici. La comprensione complessiva è presente, però non è del tutto accurata."},{"idx":4,"text":"Spiega cosa si intende per rete informatica.","open":true,"options":[],"answer":"La rete è un collegamento tra nodi (ovvero dispositivi tecnologici) legati tra loro da cavi fisici o virtuali. \nEsistono diversi tipi di rete fisiche o virtuali: la rete Ethernet, LAN (local area network), WLAN (wireless local area network), WAN (wide area network) tipo Internet. ","correct":"","score":3,"feedback":"La risposta è corretta e ben strutturata. Definisce la rete come insieme di nodi collegati tramite cavi fisici o virtuali e richiama in modo pertinente alcune tipologie di collegamento e di rete."},{"idx":5,"text":"Spiega il concetto di user experience.","open":true,"options":[],"answer":"Al momento della realizzazione di un sito web esistono due figure principali che creano l'interfaccia e l'estetica del sito (User Interface) e che si occupano di far vivere un'esperienza positiva all'utente (User Experience).\nIn particolare lo UX controlla che il sito funzioni bene, sia facile da usare, sia accessibile a tutti (anche alle persone con disabilità e epilessia), sia chiaro e completo. Deve prevedere l'errore che l'utente può fare e aiutare a risolverlo, o cambiando l'organizzazione del layout e dei collegamenti, o facilitando il riconoscimento e guidando alla risoluzione di esso. L'esperienza sul sito deve essere guidata, ben organizzata e semplice, con l'obiettivo di non far sentire l'utente inadeguato e non farlo uscire dal sito.  ","correct":"","score":2,"feedback":"La risposta contiene diversi elementi coerenti con il concetto di user experience, in particolare la facilità d’uso e la buona organizzazione della navigazione. Tuttavia non esplicita in modo preciso che l’UX studia le interazioni tra utenti e prodotti o servizi per migliorare soddisfazione e fedeltà dell’utilizzatore."},{"idx":6,"text":"Che cosa si intende per accessibilitÃ  web?","open":false,"options":["A. Eliminazione delle barriere per utenti con disabilitÃ ","B. VelocitÃ  di caricamento del sito","C. DisponibilitÃ  di contenuti pubblicitari","D. Numero di pagine pubblicate"],"answer":"A. Eliminazione delle barriere per utenti con disabilitÃ ","correct":"A. Eliminazione delle barriere per utenti con disabilitÃ ","score":"","feedback":""},{"idx":7,"text":"Quale funzione svolge il protocollo TCP?","open":false,"options":["A. Garantire lâ€™affidabilitÃ  della trasmissione dei dati","B. Gestire la grafica delle pagine web","C. Stabilire la velocitÃ  della connessione","D. Assegnare i nomi di dominio"],"answer":"A. Garantire lâ€™affidabilitÃ  della trasmissione dei dati","correct":"A. Garantire lâ€™affidabilitÃ  della trasmissione dei dati","score":"","feedback":""},{"idx":8,"text":"Quale linguaggio Ã¨ utilizzato per strutturare le pagine web?","open":false,"options":["A. HTML","B. MP3","C. JPEG","D. PDF"],"answer":"A. HTML","correct":"A. HTML","score":"","feedback":""},{"idx":9,"text":"Una rete Wi-Fi Ã¨ tecnicamente definita come:","open":false,"options":["A. WLAN","B. WAN","C. MAN","D. PAN"],"answer":"A. WLAN","correct":"A. WLAN","score":"","feedback":""},{"idx":10,"text":"Quale funzione svolgono i motori di ricerca rispetto al sito?","open":false,"options":["A. Indicizzare e rendere trovabili i contenuti","B. Scrivere i contenuti","C. Creare la grafica","D. Gestire lâ€™hardware"],"answer":"A. Indicizzare e rendere trovabili i contenuti","correct":"A. Indicizzare e rendere trovabili i contenuti","score":"","feedback":""},{"idx":11,"text":"Quale problema puÃ² causare codice non valido?","open":false,"options":["A. Diversa visualizzazione tra browser","B. Spegnimento del computer","C. Perdita della connessione telefonica","D. Cancellazione automatica del sito"],"answer":"A. Diversa visualizzazione tra browser","correct":"A. Diversa visualizzazione tra browser","score":"","feedback":""},{"idx":12,"text":"Cosa indica lâ€™acronimo LAN?","open":false,"options":["A. Local Area Network","B. Long Access Network","C. Linked Application Node","D. Logical Area Node"],"answer":"A. Local Area Network","correct":"A. Local Area Network","score":"","feedback":""},{"idx":13,"text":"Qual Ã¨ la funzione principale di un sito web per unâ€™attivitÃ  economica?","open":false,"options":["A. Farsi trovare e comunicare prodotti e servizi","B. Sostituire la produzione aziendale","C. Archiviare documenti personali","D. Bloccare lâ€™accesso ai social"],"answer":"A. Farsi trovare e comunicare prodotti e servizi","correct":"A. Farsi trovare e comunicare prodotti e servizi","score":"","feedback":""},{"idx":14,"text":"PerchÃ© Ã¨ importante aggiornare un sito web?","open":false,"options":["A. Per evitare unâ€™immagine negativa dellâ€™attivitÃ ","B. Per ridurre i visitatori","C. Per disattivare i contenuti","D. Per eliminare i motori di ricerca"],"answer":"A. Per evitare unâ€™immagine negativa dellâ€™attivitÃ ","correct":"A. Per evitare unâ€™immagine negativa dellâ€™attivitÃ ","score":"","feedback":""},{"idx":15,"text":"Che cosâ€™Ã¨ il W3C?","open":false,"options":["A. Un consorzio che stabilisce gli standard del web","B. Un browser","C. Un provider Internet","D. Un sistema operativo"],"answer":"A. Un consorzio che stabilisce gli standard del web","correct":"A. Un consorzio che stabilisce gli standard del web","score":"","feedback":""}];
    const totalPoints = 20;
    const totalMax = 25;
    const voto = 8;
    let index = 0;
    const content = document.getElementById("content");
    const mask = document.getElementById("mask");

    function render() {
      if (index >= questions.length) {
        content.innerHTML = `<div class="summary">

          <div class="label" style="margin-top:8px;">Voto</div>

        return;
      }
      const q = questions[index];
      const opts = q.options && q.options.length ? q.options.map(o => '<div class="opt">' + o + '</div>').join("") : "";
      const openBlock = q.open ? `
        <div class="label">Risposta data</div>
        <div>${q.answer || "-"}</div>
        <div class="label">Punteggio</div>
        <div>${q.score || "-"}</div>

        <div>${q.feedback || "-"}</div>` : `

      content.innerHTML = `
        <div class="q-title">${q.idx}. ${q.text}</div>
        ${opts}
        ${openBlock}
      `;
    }
    document.getElementById("prev").addEventListener("click", () => {
      index = Math.max(0, index - 1);
      render();
    });
    document.getElementById("next").addEventListener("click", () => {
      index = Math.min(questions.length, index + 1);
      render();
    });
    document.addEventListener("keydown", (e) => {
      if (e.ctrlKey || e.metaKey) mask.classList.add("hidden");
    });
    document.addEventListener("keyup", (e) => {
      if (!e.ctrlKey && !e.metaKey) mask.classList.remove("hidden");
    });
    render();
  </script>
