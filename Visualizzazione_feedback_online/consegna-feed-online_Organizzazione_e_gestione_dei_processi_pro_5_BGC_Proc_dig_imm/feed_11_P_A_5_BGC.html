itarlo a visitare prossimamente la pagina web dell'azienda e quindi di fidelizzarlo.","correct":"","score":3,"feedback":"La risposta è corretta e articolata. Distingue in modo sostanzialmente pertinente tra aspetto grafico e qualità dell'esperienza d'uso, e spiega che la user experience riguarda facilità, piacevolezza di navigazione, comprensione dei contenuti e fidelizzazione dell'utente. La terminologia non è sempre precisa, ma la comprensione complessiva è buona."},{"idx":5,"text":"Spiega a cosa serve un sito web per unâ€™azienda.","open":true,"options":[],"answer":"Il sito web è parte fondamentale di un'azienda o brand. Permette di farsi trovare, promuovere e mostrare ciò che l'azienda ha da offrire prendendo la funzione di una vetrina, non fisica, ma immateriale, col vantaggio di essere disponibile e accessibile in qualsiasi momento e da qualsiasi luogo. Il sito per essere funzionale deve essere progettato e realizzato in maniera corretta, rispettare la brand identity e i valori dell'azienda rende il sito riconoscibile e appropriato al brand che rappresenta. Un'azienda può sfruttare il proprio sito web, oltre che per pubblicizzare e rendere disponibili i prodotti, anche a raccontare la sua storia, i suoi valori e a fornire le giuste informazioni necessarie. Importante è il collegamento con i social, una gestione adeguata dei social dell'azienda permette, infatti, di dare più visibilità al sito web ottenendo più accessi alla pagina. Il sito necessita di revisioni e aggiornamenti periodici, oltre ad aggiungere news, sconti e nuove informazioni, la procedura di revisione permette di non trascurare il sito web, che con il tempo potrebbe diventare obsoleto e non rappresentare più appropriatamente il brand, fornendo quindi un'immagine negativa di esso.","correct":"","score":3,"feedback":"La risposta è completa e corretta. Spiega in modo efficace che il sito serve a far trovare l'azienda, mostrare prodotti e servizi, comunicare valori e identità del brand, funzionare
