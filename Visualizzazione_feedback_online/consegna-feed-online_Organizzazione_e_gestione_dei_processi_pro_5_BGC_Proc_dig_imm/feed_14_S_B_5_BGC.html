 funzione dei protocolli TCP e IP.","open":true,"options":[],"answer":"L'IP è un codice di 4 cifre composto da numeri che vanno da 0 a 255 che permette di identificare un computer o un dispositivo, è come se fosse un impronta digitale che lascia segno di qualsiasi cosa. Inoltre i codici IP vengono assegnati a livello globale a ogni compagnia telefonica che possederà sempre lo stesso. \nIl TCP è ciò che permette che le informazioni partano e arrivino correttamente a tutti i dispositivi che devono consultarle.","correct":"","score":2,"feedback":"Risposta parzialmente corretta: distingue in modo adeguato l’IP come codice che identifica il dispositivo e il TCP come protocollo che consente il corretto arrivo delle informazioni. Sono però presenti alcune imprecisioni nella descrizione dell’indirizzo IP e nella parte finale sul suo uso globale."},{"idx":4,"text":"Spiega a cosa serve un sito web per unâ€™azienda.","open":true,"options":[],"answer":"Il sito web per un'azienda ha un ruolo molto importante e perciò va creato e mantenuto correttamente. Il sito web rappresenta come una sorta di \"vetrina\" l'azienda, infatti deve rispecchiare l'identità e la filosofia dell'azienda, inoltre va sempre mantenuto aggiornato per mostrare agli utenti che quell'azienda è sempre attenta e presente, un aggiornamento non costante porta alla perdita di visibilità.","correct":"","score":2,"feedback":"Risposta corretta ma non completa: sono presenti i concetti di vetrina aziendale, identità e aggiornamento del sito, ma mancano altri aspetti fondamentali come la presentazione di prodotti e servizi e l’accessibilità continua."},{"idx":5,"text":"Descrivi le fasi preliminari della progettazione di un sito web.","open":true,"options":[],"answer":"Le fasi preliminari della progettazione di un sito web sono: una ricerca di marketing e un'analisi di ciò che è già presente sul web, la scelta di come rappresentare graficamente e concettualmente il contenuto del sito web e infine come scrivere i contenuti seguendo delle determinate regole. Dopo di che si passerà alla traduzione della grafica in codici.","correct":"","score":1.5,"feedback":"Risposta parzialmente corretta: individua alcune fasi pertinenti, come la ricerca iniziale, l’analisi di ciò che esiste già, la definizione grafica e concettuale dei contenuti e la scrittura dei testi. Manca però una ricostruzione più ordinata e completa delle fasi preliminari, in particolare il colloquio con il committente, il planning, il preventivo e il prototipo."},{"idx":6,"text":"Qual Ã¨ lo scopo della validazione di un sito?","open":false,"options":["A. Verificare la conformitÃ  agli standard internazionali","B. Bloccare lâ€™accesso agli utenti","C. Aumentare la dimensione delle immagini","D. Ridurre i contenuti"],"answer":"A. Verificare la conformitÃ  agli standard internazionali","correct":"A. Verificare la conformitÃ  agli standard internazionali","score":"","feedback":""},{"idx":7,"text":"Che cosa rappresenta la rete informatica?","open":false,"options":["A. Un insieme di nodi collegati tra loro","B. Un unico computer centrale","C. Un archivio di file digitali","D. Un software di navigazione"],"answer":"A. Un insieme di nodi collegati tra loro","correct":"A. Un insieme di nodi collegati tra loro","score":"","feedback":""},{"idx":8,"text":"In cosa consiste la piramide rovesciata?","open":false,"options":["A. Presentare prima le informazioni essenziali e poi i dettagli","B. Scrivere prima i dettagli e poi il titolo","C. Inserire solo immagini","D. Utilizzare solo frasi lunghe"],"answer":"A. Presentare prima le informazioni essenziali e poi i dettagli","correct":"A. Presentare prima le informazioni essenziali e poi i dettagli","score":"","feedback":""},{"idx":9,"text":"Che cosa Ã¨ il World Wide Web?","open":false,"options":["A. Un sistema di documenti collegati tramite ipertesti","B. Un sistema operativo","C. Un programma di navigazione","D. Un database offline"],"answer":"A. Un sistema di documenti collegati tramite ipertesti","correct":"A. Un sistema di documenti collegati tramite ipertesti","score":"","feedback":""},{"idx":10,"text":"Quale problema puÃ² causare codice non valido?","open":false,"options":["A. Diversa visualizzazione tra browser","B. Spegnimento del computer","C. Perdita della connessione telefonica","D. Cancellazione automatica del sito"],"answer":"A. Diversa visualizzazione tra browser","correct":"A. Diversa visualizzazione tra browser","score":"","feedback":""},{"idx":11,"text":"Che cosa si intende per prodotto immateriale?","open":false,"options":["A. Un prodotto privo di forma fisica","B. Un prodotto composto da materiali sintetici","C. Un prodotto digitale memorizzato su supporto ottico","D. Un prodotto non destinato alla vendita"],"answer":"A. Un prodotto privo di forma fisica","correct":"A. Un prodotto privo di forma fisica","score":"","feedback":""},{"idx":12,"text":"Quale funzione svolgono i motori di ricerca rispetto al sito?","open":false,"options":["A. Indicizzare e rendere trovabili i contenuti","B. Scrivere i contenuti","C. Creare la grafica","D. Gestire lâ€™hardware"],"answer":"A. Indicizzare e rendere trovabili i contenuti","correct":"A. Indicizzare e rendere trovabili i contenuti","score":"","feedback":""},{"idx":13,"text":"Qual Ã¨ la funzione delle cinque W nella scrittura web?","open":false,"options":["A. Fornire subito le informazioni principali","B. Decorare il testo","C. Allungare lâ€™articolo","D. Ridurre il traffico"],"answer":"A. Fornire subito le informazioni principali","correct":"A. Fornire subito le informazioni principali","score":"","feedback":""},{"idx":14,"text":"Che cosa sono i webinar?","open":false,"options":["A. Seminari online in diretta o registrati","B. Forum di discussione testuale","C. Documenti condivisi offline","D. Applicazioni per editing video"],"answer":"A. Seminari online in diretta o registrati","correct":"A. Seminari online in diretta o registrati","score":"","feedback":""},{"idx":15,"text":"Quale linguaggio Ã¨
