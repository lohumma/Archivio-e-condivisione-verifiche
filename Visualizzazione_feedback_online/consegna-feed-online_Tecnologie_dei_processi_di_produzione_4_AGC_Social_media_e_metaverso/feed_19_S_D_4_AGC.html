rso, quindi il concetto di metaverso si usa per indicare una cosa che va oltre l'universo fisico o quello conosciuto, la sua origine è avvenuta nel 1992 con il romanzo \"snow crash\", di Neal Stephenson, che il concetto di metaverso viene usato per descrivere un mondo virtuale ambientato in un cyberspazio.","correct":"","score":3,"feedback":"Risposta completa e corretta: spieghi bene il significato del termine e l’origine culturale legata al romanzo di fantascienza."},{"idx":5,"text":"Nel romanzo Snow Crash, il metaverso è:","open":false,"options":["A. Un archivio digitale","B. Un mondo virtuale 3D popolato da avatar","C. Un social bidimensionale","D. Un sistema di pagamento"],"answer":"B. Un mondo virtuale 3D popolato da avatar","correct":"B. Un mondo virtuale 3D popolato da avatar","score":"","feedback":""},{"idx":6,"text":"Che cosa caratterizza il marketing globale?","open":false,"options":["A. Strategie locali diverse","B. Brand e strategie unificate a livello mondiale","C. Produzione artigianale","D. Assenza di comunicazione"],"answer":"B. Brand e strategie unificate a livello mondiale","correct":"B. Brand e strategie unificate a livello mondiale","score":"","feedback":""},{"idx":7,"text":"Quale mezzo di comunicazione ha segnato il Novecento insieme alla radio?","open":false,"options":["A. Internet","B. Televisione","C. Cinema","D. Stampa online"],"answer":"C. Cinema","correct":"B. Televisione","score":"","feedback":""},{"idx":8,"text":"Nel marketing relazionale, che ruolo ha l’utente “evangelist”?","open":false,"options":["A. È un dipendente dell’azienda","B. È un cliente che promuove spontaneamente il brand","C. È un influencer pagato","D. È un fornitore"],"answer":"B. È un cliente che promuove spontaneamente il brand","correct":"B. È un cliente che promuove spontaneamente il brand","score":"","feedback":""},{"idx":9,"text":"Secondo il testo, la direzione evolutiva dei social è legata a:","open":false,"options":["A. Riduzione delle interazioni","B. Esperienze     const totalPoints = 17;
    const totalMax = 22;

    const mask = document.getElementById("mask");

    function render() {
      if (index >= questions.length) {

        return;
      }
      const q = questions[index];
      const opts = q.options && q.options.length ? q.options.map(o => '<div class="opt">' + o + '</div>').join("") : "";
      const openBlock = q.open ? `
        <div class="label">Risposta data</div>

        <div>${q.score || "-"}</div>

        <div>${q.correct || "-"}</div>`;
      content.innerHTML = `
        <div class="q-title">${q.idx}. ${q.text}</div>
        ${opts}
        ${openBlock}
      `;
    }
    document.getElementById("prev").addEventListener("click", () => {
      index = Math.max(0, index - 1);
      render();
    });
    document.getElementById("next").addEventListener("click", () => {
      index = Math.min(questions.length, index + 1);

    document.addEventListener("keydown", (e) => {
      if (e.ctrlKey || e.metaKey) mask.classList.add("hidden");
    });
    document.addEventListener("keyup", (e) => {
