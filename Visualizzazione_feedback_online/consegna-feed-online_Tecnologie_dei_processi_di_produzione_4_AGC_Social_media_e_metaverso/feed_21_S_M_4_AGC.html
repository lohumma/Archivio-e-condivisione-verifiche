ndo conoscere la propria azienda ed i suoi punti di forza rafforzando anche il rapporto col cliente (meeting) e quindi fedelizzando lo stesso e incrementando le vendite","correct":"","score":2,"feedback":"La risposta coglie l’idea generale: i social aiutano a far conoscere il brand e a rafforzare la relazione con il cliente, con effetti su fidelizzazione e vendite. Tuttavia resta molto generale e non esplicita alcuni elementi centrali della trasformazione della comunicazione aziendale descritti nel riferimento."},{"idx":4,"text":"Qual è la funzione della crittografia?","open":true,"options":[],"answer":"la crittografia funge da password per proteggere passaggi economici riducendo il rischio di hacking o bloccando l'hacker in tempo prima che lo stesso faccia danni","correct":"","score":1,"feedback":"La risposta collega la crittografia alla sicurezza delle operazioni, ma la spiegazione è troppo semplificata e imprecisa. La crittografia è presentata come strumento per garantire riservatezza delle operazioni e sicurezza informatica, riducendo i rischi di contraffazione e manomissione."},{"idx":5,"text":"Spiega il funzionamento di base della blockchain.","open":true,"options":[],"answer":"le blockchain sono \"blocchi\" contenenti informazioni con al loro interno le NFT e che tengono traccia di tutti i passaggi eseguiti, il suo punto di forza è il fatto che sia molto sicura in quanto ci siano continui controlli e soprattutto contiene anche il passaggio dal blocco precedente al successivo","correct":"","score":1,"feedback":"Sono presenti concetti generali (blocchi collegati, tracciabilità). Mancano gli elementi espliciti del funzionamento: libro mastro pubblico, peer to peer, hash (impronta) e hash del blocco precedente, nonce/proof of work (mining) e consenso dei nodi."},{"idx":6,"text":"Quale evento ha accelerato l’uso delle piattaforme digitali?","open":false,"options":["A. La crisi economica del 2008","B. La pandemia da Covid-19","C. La nascita dei social","D. L’avvento degli smartphone"],"answer":"B. La pandemia da Covid-19","correct":"B. La pandemia da Covid-19","score":"","feedback":""},{"idx":7,"text":"Perché le aziende utilizzano i social media nel marketing?","open":false,"options":["A. Perché sono gratuiti","B. Perché gli utenti vi trascorrono molto tempo","C. Perché sostituiscono i prodotti","D. Perché eliminano la concorrenza"],"answer":"B. Perché gli utenti vi trascorrono molto tempo","correct":"B. Perché gli utenti vi trascorrono molto tempo","score":"","feedback":""},{"idx":8,"text":"Perché il sistema dei social viene definito bidirezionale e non democratico?","open":false,"options":["A. Perché tutti hanno gli stessi diritti","B. Perché opera su piattaforme proprietarie","C. Perché non permette commenti","D. Perché è anonimo"],"answer":"A. Perché tutti hanno gli stessi diritti","correct":"B. Perché opera su piattaforme proprietarie","score":"","feedback":""},{"idx":9,"text":"Qual è definita come la vera ricchezza del XXI secolo?","open":false,"options":["A. L’oro","B. Le informazioni","C. L’energia","D. Il territorio"],"answer":"B. Le informazioni","correct":"B. Le informazioni","score":"","feedback":""},{"idx":10,"text":"Quale figura professionale è citata come centrale nel Social Media Marketing?","open":false,"options":["A. Il grafico","B. L’influencer","C. Il programmatore","D. Il tipografo"],"answer":"B. L’influencer","correct":"B. L’influencer","score":"","feedback":""},{"idx":11,"text":"Qual è la funzione principale del marketing?","open":false,"options":["A. Vendere direttamente un prodotto","B. Identificare i bisogni delle persone e trovare il modo migliore per soddisfarli","C. Creare slogan pubblicitari","D. Gestire solo la comunicazione visiva"],"answer":"B. Identificare i bisogni delle persone e trovare il modo migliore per soddisfarli","correct":"B. Identificare i bisogni delle persone e trovare il modo migliore per soddisfarli","score":"","feedback":""},{"idx":12,"text":"Che cosa caratterizza il marketing globale?","open":false,"options":["A. Strategie locali diverse","B. Brand e strategie unificate a livello mondiale","C. Produzione artigianale","D. Assenza di comunicazione"],"answer":"B. Brand e strategie unificate a livello mondiale","correct":"B. Brand e strategie unificate a livello mondiale","score":"","feedback":""},{"idx":13,"text":"Il marketing sociale utilizza le strategie del marketing per:","open":false,"options":["A. Aumentare solo i profitti","B. Influenzare comportamenti a vantaggio degli individui o della società","C. Eliminare la pubblicità","D. Sostituire le istituzioni"],"answer":"B. Influenzare comportamenti a vantaggio degli individui o della società","correct":"B. Influenzare comportamenti a vantaggio degli individui o della società","score":"","feedback":""},{"idx":14,"text":"Nel marketing relazionale, che ruolo ha l’utente “evangelist”?","open":false,"options":["A. È un dipendente dell’azienda","B. È un cliente che promuove spontaneamente il brand","C. È un influencer pagato","D. È un fornitore"],"answer":"B. È un cliente che promuove spontaneamente il brand","correct":"B. È un cliente che promuove spontaneamente il brand","score":"","feedback":""},{"idx":15,"text":"Che cosa ha supplito alle attività in presenza durante la pandemia?","open":false,"options":["A. Solo i social network","B. Teleconferenze, didattica a distanza e telelavoro","C. La televisione","D. La stampa"],"answer":"B. Teleconferenze, didattica a distanza e telelavoro","correct":"B. Teleconferenze, didattica a distanza e telelavoro","score":"","feedback":""},{"idx":16,"text":"Qual è una delle principali motivazioni economiche dietro lo sviluppo del metaverso?","open":false,"options":["A. Ridurre i costi energetici","B. Creare un nuovo grande mercato","C. Eliminare la concorrenza","D. Sostituire il lavoro umano"],"answer":"B. Creare un nuovo grande mercato","correct":"B. Creare un nuovo grande mercato","score":"","feedback":""},{"idx":17,"text":"Il marketing relazionale si focalizza soprattutto su:","open":false,"options":["A. Il prezzo","B. Il cliente","C. Il prodotto","D. La distribuzione"],"answer":"B. Il cliente","correct":"B. Il cliente","score":"","feedback":""},{"idx":18,"text":"Con l’avvento di internet, le aziende hanno affiancato ai media tradizionali:","open":false,"options":["A. Solo la televisione satellitare","B. I nuovi media nati con la rete","C. Esclusivamente i videogiochi","D. Unicamente le app proprietarie"],"answer":"B. I nuovi media nati con la rete","correct":"B. I nuovi media nati con la rete","score":"","feedback":""},{"idx":19,"text":"Che cosa significa gamification?","open":false,"options":["A. Eliminare il gioco","B. Usare il gioco come leva motivazionale","C. Sostituire il marketing","D. Creare videogiochi"],"answer":"B. Usare il gioco come leva motivazionale","correct":"B. Usare il gioco come leva motivazionale","score":"","feedback":""},{"idx":20,"text":"La pubblicità (advertising) viene descritta come:","open":false,"options":["A. Sinonimo di marketing","B. Una componente del marketing","C. Un’attività indipendente dal marketing","D. Una pratica esclusivamente digitale"],"answer":"B. Una componente del marketing","correct":"B. Una componente del marketing","score":"","feedback":""}];
    const totalPoints = 22;
    const totalMax = 30;
    const voto = 7.3;
    let index = 0;

    function render() {
      if (index >= questions.length) {
        content.innerHTML = `<div class="summary">
          <div class="label">Punteggio ottenuto</div>

          <div class="label" style="margin-top:8px;">Voto</div>

      }
      const q = questions[index];
      const opts = q.options && q.options.length ? q.options.map(o => '<div class="opt">' + o + '</div>').join("") : "";
      const openBlock = q.open ? `
        <div class="label">Risposta data</div>
        <div>${q.answer || "-"}</div>
        <div class="label">Punteggio</div>
        <div>${q.score || "-"}</div>
        <div class="label">Feedback</div>

        <div>${q.correct || "-"}</div>`;
      content.innerHTML = `
        <div class="q-title">${q.idx}. ${q.text}</div>
        ${opts}
        ${openBlock}
      `;
    }
    document.getElementById("prev").addEventListener("click", () => {
      index = Math.max(0, index - 1);
      render();
    });
    document.getElementById("next").addEventListener("click", () => {
      index = Math.min(questions.length, index + 1);
      render();
    });
    document.addEventListener("keydown", (e) => {
      if (e.ctrlKey || e.metaKey) mask.classList.add("hidden");
    });
    document.addEventListener("keyup", (e) => {
      if (!e.ctrlKey && !e.metaKey) mask.classList.remove("hidden");
    });
    render();
