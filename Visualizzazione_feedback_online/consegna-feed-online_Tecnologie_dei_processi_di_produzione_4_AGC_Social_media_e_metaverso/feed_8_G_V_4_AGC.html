    const questions = [{"idx":1,"text":"Spiega i rischi e le opportunità del metaverso dal punto di vista sociale ed economico.","open":true,"options":[],"answer":"Il maggiore rischio del metaverso dal punto di vista sociale ed economico è \"Se il servizio è gratis la merce sei tu\", le opportunità sono molteplici ","correct":"","score":1,"feedback":"Risposta molto incompleta: individua il principio “se un servizio è gratis, la merce sei tu”, ma non descrive in modo chiaro né i rischi (dati biometrici/sensibili) né le opportunità sociali ed economiche."},{"idx":2,"text":"Descrivi il concetto di metaverso e la sua origine culturale.","open":true,"options":[],"answer":"Il termine metaverso deriva dal greco meta (oltre) e dalla contrazione di \"universo\" indica qualcosa che va oltre il mondo fisico. Fu coniato nel 1992 dallo scrittore Neal Stepherson nel romanzo \"cyberpunk Snow Crash\", dove descriveva un mondo virtuale in 3D popolato da avatar. Ovvero copie digitali di se stessi.","correct":"","score":3,"feedback":"Risposta completa e corretta: spiega l’etimologia del termine e l’origine culturale (autore, anno, opera) e definisce correttamente il metaverso come mondo virtuale 3D con avatar."},{"idx":3,"text":"Descrivi il ruolo dei social media nell’evoluzione della comunicazione aziendale.","open":true,"options":[],"answer":"L'essere umano ha sempre avuto un bisogno innato di comunicare e trasmettere il sapere. I social media rappresentano l'evoluzione moderna dell'agorà antica o della piazza del mercato medievale: luoghi di confronto, scambio di idee,  economia e persino litigi. Se nel novecento venivano utilizzate la radio e la televisione adesso invece l'avvento di internet ha reso la comunicazione \"bidirezionale\".","correct":"","score":2,"feedback":"Risposta corretta: spiega i social come evoluzione dell’agorà e richiama la comunicazione bidirezionale. Manca però un riferimento alle piattaforme proprietarie e al ruolo del passaparola nella qualità di prodotti e servizi."},{"idx":4,"text":"Spiega perché i social media sono paragonati alle agorà dell’antichità.","open":true,"options":[],"answer":"Perché i social media rappresentano l'evoluzione moderna dell'agorà antica o della piazza del mercato medievale.\nSarebbe stato impensabile al tempo che saremmo arrivati così tanto in alto, una comunità di persone unite da un apparentemente semplice dispositivo digitale.","correct":"","score":1,"feedback":"Risposta incompleta: ripete l’idea generale di evoluzione dell’agorà, ma non spiega gli elementi del paragone (confronto di idee, contrapposizione e scambio economico)."},{"idx":5,"text":"Spiega il funzionamento di base della blockchain.","open":true,"options":[],"answer":"Il funzionamento di base della blockchain (nata nel 2008 ad opera di Nakamoto, registro pubblico condiviso e indissolubile che funziona come un notaio digitale) è il seguente:\nimmaginiamoci una serie di blocchi, un sorta di catena che li unisca tutti quanti. Questi blocchi contengono dati della transazione, un Hash (un'impronta digitale unica che cambia se il contenuto viene modificato) e un Hash del blocco precedente (collega i blocchi in una sequenza temporale sicura). ","correct":"","score":2,"feedback":"Risposta corretta: descrive la blockchain come registro pubblico condiviso e spiega bene il ruolo dell’hash e del collegamento tra blocchi tramite hash precedente. Mancano però elementi chiave del processo di validazione (peer to peer, consenso, nonce/proof of work e mining)."},{"idx":6,"text":"Quale caratteristica NON appartiene agli NFT?","open":false,"options":["A. Indivisibilità","B. Unicità","C. Riproducibilità infinita","D. Tracciabilità"],"answer":"B. Unicità","correct":"C. Riproducibilità infinita","score":"","feedback":""},{"idx":7,"text":"Perché il sistema dei social viene definito bidirezionale e non democratico?","open":false,"options":["A. Perché tutti hanno gli stessi diritti","B. Perché opera su piattaforme proprietarie","C. Perché non permette commenti","D. Perché è anonimo"],"answer":"B. Perché opera su piattaforme proprietarie","correct":"B. Perché opera su piattaforme proprietarie","score":"","feedback":""},{"idx":8,"text":"Che cosa caratterizza il marketing globale?","open":false,"options":["A. Strategie locali diverse","B. Brand e strategie unificate a livello mondiale","C. Produzione artigianale","D. Assenza di comunicazione"],"answer":"B. Brand e strategie unificate a livello mondiale","correct":"B. Brand e strategie unificate a livello mondiale","score":"","feedback":""},{"idx":9,"text":"Quale figura professionale è citata come centrale nel Social Media Marketing?","open":false,"options":["A. Il grafico","B. L’influencer","C. Il programmatore","D. Il tipografo"],"answer":"B. L’influencer","correct":"B. L’influencer","score":"","feedback":""},{"idx":10,"text":"Qual è la funzione principale del marketing?","open":false,"options":["A. Vendere direttamente un prodotto","B. Identificare i bisogni delle persone e trovare il modo migliore per soddisfarli","C. Creare slogan pubblicitari","D. Gestire solo la comunicazione visiva"],"answer":"B. Identificare i bisogni delle persone e trovare il modo migliore per soddisfarli","correct":"B. Identificare i bisogni delle persone e trovare il modo migliore per soddisfarli","score":"","feedback":""},{"idx":11,"text":"Che cosa garantisce oggi maggiormente la qualità di un prodotto o servizio?","open":false,"options":["A. La pubblicità televisiva","B. Il passaparola sui social media","C. Il prezzo elevato","D. Il marchio storico"],"answer":"B. Il passaparola sui social media","correct":"B. Il passaparola sui social media","score":"","feedback":""},{"idx":12,"text":"Che cosa significa gamification?","open":false,"options":["A. Eliminare il gioco","B. Usare il gioco come leva motivazionale","C. Sostituire il marketing","D. Creare videogiochi"],"answer":"B. Usare il gioco come leva motivazionale","correct":"B. Usare il gioco come leva motivazionale","score":"","feedback":""},{"idx":13,"text":"La pubblicità (advertising) viene descritta come:","open":false,"options":["A. Sinonimo di marketing","B. Una componente del marketing","C. Un’attività indipendente dal marketing","D. Una pratica esclusivamente digitale"],"answer":"B. Una componente del marketing","correct":"B. Una componente del marketing","score":"","feedback":""},{"idx":14,"text":"Il termine metaverso indica:","open":false,"options":["A. Un nuovo social network","B. Un universo oltre quello fisico","C. Un software di montaggio","D. Un videogioco specifico"],"answer":"B. Un universo oltre quello fisico","correct":"B. Un universo oltre quello fisico","score":"","feedback":""},{"idx":15,"text":"Quale evento ha accelerato l’uso delle piattaforme digitali?","open":false,"options":["A. La crisi economica del 2008","B. La pandemia da Covid-19","C. La nascita dei social","D. L’avvento degli smartphone"],"answer":"B. La pandemia da Covid-19","correct":"B. La pandemia da Covid-19","score":"","feedback":""},{"idx":16,"text":"Che cosa ha supplito alle attività in presenza durante la pandemia?","open":false,"options":["A. Solo i social network","B. Teleconferenze, didattica a distanza e telelavoro","C. La televisione","D. La stampa"],"answer":"B. Teleconferenze, didattica a distanza e telelavoro","correct":"B. Teleconferenze, didattica a distanza e telelavoro","score":"","feedback":""},{"idx":17,"text":"Il marketing digitale applica strategie comunicative principalmente su:","open":false,"options":["A. Supporti cartacei","B. Dispositivi digitali","C. Eventi dal vivo","D. Canali radiofonici"],"answer":"B. Dispositivi digitali","correct":"B. Dispositivi digitali","score":"","feedback":""},{"idx":18,"text":"Un NFT rappresenta:","open":false,"options":["A. L’acquisto fisico di un bene","B. La prova di un diritto su un bene unico","C. Una criptovaluta","D. Un file multimediale"],"answer":"B. La prova di un diritto su un bene unico","correct":"B. La prova di un diritto su un bene unico","score":"","feedback":""},{"idx":19,"text":"Il marketing sociale utilizza le strategie del marketing per:","open":false,"options":["A. Aumentare solo i profitti","B. Influenzare comportamenti a vantaggio degli individui o della società","C. Eliminare la pubblicità","D. Sostituire le istituzioni"],"answer":"B. Influenzare comportamenti a vantaggio degli individui o della società","correct":"B. Influenzare comportamenti a vantaggio degli individui o della società","score":"","feedback":""},{"idx":20,"text":"Con l’avvento di internet, le aziende hanno affiancato ai media tradizionali:","open":false,"options":["A. Solo la televisione satellitare","B. I nuovi media nati con la rete","C. Esclusivamente i videogiochi","D. Unicamente le app proprietarie"],"answer":"B. I nuovi media nati con la rete","correct":"B. I nuovi media nati con la rete","score":"","feedback":""}];
    const totalPoints = 23;
    const totalMax = 30;
    const voto = 7.7;
    let index = 0;
    const content = document.getElementById("content");
    const mask = document.getElementById("mask");

    function render() {
      if (index >= questions.length) {
        content.innerHTML = `<div class="summary">
          <div class="label">Punteggio ottenuto</div>
          <div><strong>${totalPoints} / ${totalMax}</strong></div>
          <div class="label" style="margin-top:8px;">Voto</div>
          <div><strong>${voto} / 10</strong></div>
        </div>`;
        return;
      }
      const q = questions[index];
      const opts = q.options && q.options.length ? q.options.map(o => '<div class="opt">' + o + '</div>').join("") : "";
      const openBlock = q.open ? `
        <div class="label">Risposta data</div>
        <div>${q.answer || "-"}</div>
        <div class="label">Punteggio</div>
        <div>${q.score || "-"}</div>
        <div class="label">Feedback</div>
        <div>${q.feedback || "-"}</div>` : `
        <div class="label">Risposta data</div>
        <div>${q.answer || "-"}</div>
        <div class="label">Risposta corretta</div>
        <div>${q.correct || "-"}</div>`;
      content.innerHTML = `
        <div class="q-title">${q.idx}. ${q.text}</div>
        ${opts}
        ${openBlock}
      `;
    }
    document.getElementById("prev").addEventListener("click", () => {
      index = Math.max(0, index - 1);
      render();
    });
    document.getElementById("next").addEventListener("click", () => {
      index = Math.min(questions.length, index + 1);
      render();
    });
    document.addEventListener("keydown", (e) => {
      if (e.ctrlKey || e.metaKey) mask.classList.add("hidden");
    });
    document.addEventListener("keyup", (e) => {
      if (!e.ctrlKey && !e.metaKey) mask.classList.remove("hidden");
    });
    render();
  </script>
