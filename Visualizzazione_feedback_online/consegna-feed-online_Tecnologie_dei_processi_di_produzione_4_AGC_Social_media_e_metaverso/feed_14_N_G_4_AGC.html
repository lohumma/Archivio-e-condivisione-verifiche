azione dei media, social media marketing, passaparola e natura bidirezionale ma su piattaforme proprietarie)."},{"idx":4,"text":"Spiega la differenza tra marketing e advertising.","open":true,"options":[],"answer":"MARKETING: Ha l'obiettivo di capire i punti deboli, i bisogni e le necessità della società e \ntrovare per lei le soluzioni e le risposte che le risolvono i problemi.\nADVERTISING: è una componente del marketing che viene utilizzata nel caso in cui si sponsorizza un prodotto e si trae guadagno da esso.","correct":"","score":3,"feedback":"Risposta corretta: spiega il marketing come analisi dei bisogni e ricerca di soluzioni e definisce l’advertising come componente del marketing legata alla promozione/sponsorizzazione del prodotto."},{"idx":5,"text":"Spiega perché i social media sono paragonati alle agorà dell’antichità.","open":true,"options":[],"answer":"I social media vengono paragonati alle agorà dell'antichità perché come loro, diventano un luogo di condivisione e scambi tra le persone.","correct":"","score":2,"feedback":"Risposta parzialmente corretta: coglie l’idea di luogo di scambio e interazione tra persone. Manca però l’esplicitazione del confronto delle idee e della possibile contrapposizione, che completano il paragone."},{"idx":6,"text":"Il marketing sociale utilizza le strategie del marketing per:","open":false,"options":["A. Aumentare solo i profitti","B. Influenzare comportamenti a vantaggio degli individui o della società","C. Eliminare la pubblicità","D. Sostituire le istituzioni"],"answer":"B. Influenzare comportamenti a vantaggio degli individui o della società","correct":"B. Influenzare comportamenti a vantaggio degli individui o della società","score":"","feedback":""},{"idx":7,"text":"Quali strumenti permettono esperienze immersive nel metaverso?","open":false,"options":["A. Mouse e tastiera","B. Visori VR e guanti aptici","C. Stampanti 3D","D. Scanner tradizionali"],"answer":"B. Visori VR e guanti aptici","correct":"B. Visori VR e
