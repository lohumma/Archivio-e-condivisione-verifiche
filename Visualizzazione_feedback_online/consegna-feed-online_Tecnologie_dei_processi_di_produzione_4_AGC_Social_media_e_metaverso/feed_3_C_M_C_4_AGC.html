ittente, nome del destinatario, e somma di denaro) la decrittografia dei blocchi  precedenti e successivi, in quanto quest'ultimi identificando una modifica dell'hash (codice univoco che attensta la formazione di un blocco che tiene in considerazione l'hash del blocco che lo precede) diventano non più validi, ponendo fine alla catena. \n\nQuesta tecnologia è stata scoperta da un due notai che nel 1993 vollero rendere automativa e soprattutto più sicura la \"firma\" di documenti ed attestati.","correct":"","score":2,"feedback":"Risposta in parte corretta: collega la crittografia alla protezione delle informazioni e alla sicurezza del sistema blockchain. Però contiene molte informazioni non pertinenti o non verificabili e non centra con precisione la funzione principale richiesta."},{"idx":4,"text":"Spiega la differenza tra marketing e advertising.","open":true,"options":[],"answer":"Il marketing è la ricerca delle nuove necessitudini di un gruppo di persone e conseguente realizzazione di un prodotto o servizio che vada a soddisfare questa necessità. \n\nL'advertising invece è una fase successiva del marketing dove l'azienda studia e attua strategie comunicative per rendere noto al pubblico questo prodotto o servizio. \n\nEsistono 5 tipologie di marketing: \n- marketing sociale: si vuole portare un utente a cambare in maniera autonoma il suo comportamento influenzandolo;\n- marketing digitale: strategia che sfrutta le nuove piattaforme online per pubblicizzare e raggiungere un pubblico maggiore;\n- marketing gobale: le grandi multinazionale che vendono in numerosi stati devo applicare strategie comunicative unificate a livello grlobale;\n- marketing  \n- marketing ","correct":"","score":2,"feedback":"Risposta corretta nelle definizioni principali: descrive il marketing come individuazione dei bisogni e l’advertising come fase di promozione. Manca però un riferimento esplicito ai canali a pagamento e la parte sui tipi di marketing è incompleta."},{"idx":5,"text":"Descrivi il concetto di metaverso e la sua origine culturale.","open":true,"options":[],"answer":"Il termine di metaverso è l'unione della parola graca \"metha\" (\"oltre\") e l'abbreviazione di \"universo\", volto a definire una realtà al di fuori dell'universo (fisico). Il termine venne coniato per la prima volta da uno scrittore americano che lo utilizzo nel suo romanzo fantascientifico: Snow Crash, 1993. Nel romando, l'autore immaginava un mondo virtuale in 3d abitato da avatar digitali degli utenti. Sono richiesti 4 cartatteristiche: hardwsare specifico per entrarvi come visori e guanti aptici, una grande potenza di calcolo, piattaforme realizzate appositamente per interconnettere più dispositivi e una brande banda di rete capace di rendere instantaneo le interazioni (dell'utente del mondo analogico nel mondo digitale).","correct":"","score":2,"feedback":"Risposta complessivamente corretta: spiega il significato del termine e lo collega al romanzo di fantascienza in cui viene introdotto. Tuttavia presenta un’imprecisione sull’anno e manca una parte degli elementi necessari allo sviluppo del metaverso."},{"idx":6,"text":"Perché il sistema dei social viene definito bidirezionale e non democratico?","open":false,"options":["A. Perché tutti hanno gli stessi diritti","B. Perché opera su piattaforme proprietarie","C. Perché non permette commenti","D. Perché è anonimo"],"answer":"B. Perché opera su piattaforme proprietarie","correct":"B. Perché opera su piattaforme proprietarie","score":"","feedback":""},{"idx":7,"text":"Quali strumenti permettono esperienze immersive nel metaverso?","open":false,"options":["A. Mouse e tastiera","B. Visori VR e guanti aptici","C. Stampanti 3D","D. Scanner tradizionali"],"answer":"B. Visori VR e guanti aptici","correct":"B. Visori VR e guanti aptici","score":"","feedback":""},{"idx":8,"text":"Qual è una delle principali motivazioni economiche dietro lo sviluppo del metaverso?","open":false,"options":["A. Ridurre i costi energetici","B. Creare un nuovo grande mercato","C. Eliminare la concorrenza","D. Sostituire il lavoro umano"],"answer":"B. Creare un nuovo grande mercato","correct":"B. Creare un nuovo grande mercato","score":"","feedback":""},{"idx":9,"text":"Quale mezzo di comunicazione ha segnato il Novecento insieme alla radio?","open":false,"options":["A. Internet","B. Televisione","C. Cinema","D. Stampa online"],"answer":"B. Televisione","correct":"B. Televisione","score":"","feedback":""},{"idx":10,"text":"Con l’avvento di internet, le aziende hanno affiancato ai media tradizionali:","open":false,"options":["A. Solo la televisione satellitare","B. I nuovi media nati con la rete","C. Esclusivamente i videogiochi","D. Unicamente le app proprietarie"],"answer":"B. I nuovi media nati con la rete","correct":"B. I nuovi media nati con la rete","score":"","feedback":""},{"idx":11,"text":"Nel romanzo Snow Crash, il metaverso è:","open":false,"options":["A. Un archivio digitale","B. Un mondo virtuale 3D popolato da avatar","C. Un social bidimensionale","D. Un sistema di pagamento"],"answer":"B. Un mondo virtuale 3D popolato da avatar","correct":"B. Un mondo virtuale 3D popolato da avatar","score":"","feedback":""},{"idx":12,"text":"Quale caratteristica NON appartiene agli NFT?","open":false,"options":["A. Indivisibilità","B. Unicità","C. Riproducibilità infinita","D. Tracciabilità"],"answer":"C. Riproducibilità infinita","correct":"C. Riproducibilità infinita","score":"","feedback":""},{"idx":13,"text":"Cosa intendiamo quando parliamo di PPD?","open":false,"options":["A. Pixel Per Grado","B. Nessuna delle altre risposte","C. Pixel Per Densità","D. Pixel per durata"],"answer":"A. Pixel Per Grado","correct":"A. Pixel Per Grado","score":"","feedback":""},{"idx":14,"text":"Perché le aziende utilizzano i social media nel marketing?","open":false,"options":["A. Perché sono gratuiti","B. Perché gli utenti vi trascorrono molto tempo","C. Perché sostituiscono i prodotti","D. Perché eliminano la concorrenza"],"an o fisico","C. Un software di montaggio","D. Un videogioco specifico"],"answer":"B. Un universo oltre quello fisico","correct":"B. Un universo oltre quello fisico","score":"","feedback":""},{"idx":20,"text":"Che cosa caratterizza il marketing globale?","open":false,"options":["A. Strategie locali diverse","B. Brand e strategie unificate a livello mondiale","C. Produzione artigianale","D. Assenza di comunicazione"],"answer":"B. Brand e strategie unificate a livello mondiale","correct":"B. Brand e strategie unificate a livello mondiale","score":"","feedback":""}];
