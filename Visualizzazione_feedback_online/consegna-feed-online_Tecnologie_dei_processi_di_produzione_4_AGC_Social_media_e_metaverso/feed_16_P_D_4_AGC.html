ce la possibilità di fare transizioni di denaro.","correct":"","score":1,"feedback":"Risposta molto generale: riconosce la blockchain come registro pubblico basato su una catena di blocchi, ma non spiega come garantisce la sicurezza (peer to peer, hash, collegamento tra blocchi, proof of work e consenso)."},{"idx":5,"text":"Che cosa garantisce la blockchain?","open":false,"options":["A. La velocità di connessione","B. La sicurezza e l’unicità delle transazioni","C. La qualità grafica","D. La compressione dei file"],"answer":"B. La sicurezza e l’unicità delle transazioni","correct":"B. La sicurezza e l’unicità delle transazioni","score":"","feedback":""},{"idx":6,"text":"Perché il sistema dei social viene definito bidirezionale e non democratico?","open":false,"options":["A. Perché tutti hanno gli stessi diritti","B. Perché opera su piattaforme proprietarie","C. Perché non permette commenti","D. Perché è anonimo"],"answer":"B. Perché opera su piattaforme proprietarie","correct":"B. Perché opera su piattaforme proprietarie","score":"","feedback":""},{"idx":7,"text":"Con l’avvento di internet, le aziende hanno affiancato ai media tradizionali:","open":false,"options":["A. Solo la televisione satellitare","B. I nuovi media nati con la rete","C. Esclusivamente i videogiochi","D. Unicamente le app proprietarie"],"answer":"B. I nuovi media nati con la rete","correct":"B. I nuovi media nati con la rete","score":"","feedback":""},{"idx":8,"text":"Che cosa caratterizza il marketing globale?","open":false,"options":["A. Strategie locali diverse","B. Brand e strategie unificate a livello mondiale","C. Produzione artigianale","D. Assenza di comunicazione"],"answer":"B. Brand e strategie unificate a livello mondiale","correct":"B. Brand e strategie unificate a livello mondiale","score":"","feedback":""},{"idx":9,"text":"1. Che cosa si intende per marketing digitale?","open":false,"options":["A. Una strategia basata esclusivamente sulla pubblicità televisiva","B. L’uso di strumenti digitali per raggiungere i clienti attraverso reti e piattaforme online","C. Una forma di marketing usata solo dalle grandi aziende","D. Una tecnica di vendita diretta porta a porta"],"answer":"B. L’uso di strumenti digitali per raggiungere i clienti attraverso reti e piattaforme online","correct":"B. L’uso di strumenti digitali per raggiungere i clienti attraverso reti e piattaforme online","score":"","feedback":""},{"idx":10,"text":"Che cosa garantisce oggi maggiormente la qualità di un prodotto o servizio?","open":false,"options":["A. La pubblicità televisiva","B. Il passaparola sui social media","C. Il prezzo elevato","D. Il marchio storico"],"answer":"B. Il passaparola sui social media","correct":"B. Il passaparola sui social media","score":"","feedback":""},{"idx":11,"text":"Quale evento ha accelerato l’uso delle piattaforme digitali?","open":false,"options":["A. La crisi economica del 2008","B. La pandemia da Covid-19","C. La nascita dei social","D. L’avvento degli smartphone"],"answer":"B. La pandemia da Covid-19","correct":"B. La pandemia da Covid-19","score":"","feedback":""},{"idx":12,"text":"Che cosa ha supplito alle attività in presenza durante la pandemia?","open":false,"options":["A. Solo i social network","B. Teleconferenze, didattica a distanza e telelavoro","C. La televisione","D. La stampa"],"answer":"B. Teleconferenze, didattica a distanza e telelavoro","correct":"B. Teleconferenze, didattica a distanza e telelavoro","score":"","feedback":""},{"idx":13,"text":"Nel marketing relazionale, che ruolo ha l’utente “evangelist”?","open":false,"options":["A. È un dipendente dell’azienda","B. È un cliente che promuove spontaneamente il brand","C. È un influencer pagato","D. È un fornitore"],"answer":"B. È un cliente che promuove spontaneamente il brand","correct":"B. È un cliente che promuove spontaneamente il brand","score":"","feedback":""},{"idx":14,"text":"Qual è definita come la vera ricchezza del XXI secolo?","open":false,"options":["A. L’oro","B. Le informazioni","C. L’energia","D. Il territorio"],"answer":"B. Le informazioni","correct":"B. Le informazioni","score":"","feedback":""}];
    const totalPoints = 14;
    const totalMax = 22;
    const voto = 6.4;
    let index = 0;
    const content = document.getElementById("content");
    const mask = document.getElementById("mask");

    function render() {
      if (index >= questions.length) {
        content.innerHTML = `<div class="summary">
          <div class="label">Punteggio ottenuto</div>
          <div><strong>${totalPoints} / ${totalMax}</strong></div>
          <div class="label" style="margin-top:8px;">Voto</div>
          <div><strong>${voto} / 10</strong></div>
        </div>`;
        return;
      }
      const q = questions[index];
      const opts = q.options && q.options.length ? q.options.map(o => '<div class="opt">' + o + '</div>').join("") : "";
      const openBlock = q.open ? `
        <div class="label">Risposta data</div>
        <div>${q.answer || "-"}</div>
        <div class="label">Punteggio</div>
        <div>${q.score || "-"}</div>
        <div class="label">Feedback</div>
        <div>${q.feedback || "-"}</div>` : `
        <div class="label">Risposta data</div>
        <div>${q.answer || "-"}</div>
        <div class="label">Risposta corretta</div>
        <div>${q.correct || "-"}</div>`;
      content.innerHTML = `
        <div class="q-title">${q.idx}. ${q.text}</div>
        ${opts}
        ${openBlock}
      `;
    }
    document.getElementById("prev").addEventListener("click", () => {
      index = Math.max(0, index - 1);
      render();
    });
    document.getElementById("next").addEventListener("click", () => {
      index = Math.min(questions.length, index + 1);
      render();
    });
    document.addEventListener("keydown", (e) => {
      if (e.ctrlKey || e.metaKey) mask.classList.add("hidden");
    });
    document.addEventListener("keyup", (e) => {
      if (!e.ctrlKey && !e.metaKey) mask.classList.remove("hidden");
    });
    render();
  </script>
