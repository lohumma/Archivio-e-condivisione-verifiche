    const questions = [{"idx":1,"text":"Descrivi il ruolo dei social media nell’evoluzione della comunicazione aziendale.","open":true,"options":[],"answer":"Il ruolo dei social media nella comunicazione aziendale è riscontrabile sicuramente nel cambiamento del pubblico nel tempo, la velocità del passaggio delle informazioni, l'immediatezza delle stesse, la capacità di analizzare un maggior numero di pensieri, idee e pareri. Questo, oltre a cambiare supporti e formati, rende anche più semplice una pubblicità a livello internazionale (basti pensare al trailer di un film o videogioco).","correct":"","score":1,"feedback":"Risposta parziale e generica: coglie solo alcuni elementi, con lacune rilevanti. Attenzione: per essere completa doveva includere anche l’idea di bidirezionalità (voce ai consumatori/passaparola) e il tema delle piattaforme proprietarie."},{"idx":2,"text":"Qual è la funzione della crittografia?","open":true,"options":[],"answer":"La crittografia, in tutte le sue sfaccettature, ha una funzione di sicurezza. Le informazioni inviate  vengono criptate e poi decriptate solo sul dispositivo del ricevente, rendendo più sicura la comunicazione. Basti pensare alla crittografia hand to hand di Whats App o all'utilizzo che ne viene fatto nelle Blockchain.","correct":"","score":3,"feedback":"Risposta completa e coerente: copre i punti essenziali richiesti."},{"idx":3,"text":"Descrivi il concetto di metaverso e la sua origine culturale.","open":true,"options":[],"answer":"Il concetto di metaverso nasce da un bisogno di connessione tra persone anche di diversi paesi. Oggi, il metaverso è un \"universo parallelo\" che supera le barriere fisiche in cui puoi essere sempre connesso con persone anche molto distanti da te, eseguendo azioni come interazioni sociali, acquisti, scambio di soldi, lavoro ecc. Un ruolo importante lo ha difatti nel campo economico.","correct":"","score":1,"feedback":"Risposta parziale e generica: coglie solo alcuni elementi, con lacune rilevanti. Mancano i riferimenti all’origine culturale (Snow Crash, Neal Stephenson) e agli elementi definitori (3D, avatar, etimologia del termine)."},{"idx":4,"text":"Spiega i rischi e le opportunità del metaverso dal punto di vista sociale ed economico.","open":true,"options":[],"answer":"Il metaverso sta già cambiando profondamente il modo di fare le cose online. Ciò ovviamente comporta molti vantaggi e svantaggi. Per esempio: il metaverso può portare a una maggiore velocità per azioni che spesso richiederebbero molto tempo e consente di eseguirle da praticamente ogni parte del mondo. Tuttavia, se usato in maniera sbagliata, può anche comportare un enorme rischio a livello di sicurezza per i propri dati personali, per non parlare dell'impatto ambientale.","correct":"","score":1,"feedback":"Risposta parziale e generica: coglie solo alcuni elementi, con lacune rilevanti. Sono presenti elementi non richiesti dal riferimento (es. impatto ambientale): in valutazione rigorosa non vengono considerati."},{"idx":5,"text":"Spiega la differenza tra marketing e advertising.","open":true,"options":[],"answer":"Parliamo di Marketing quando facciamo riferimento a una intera campagna, compresa di metodi fisici e non, per vendere un prodotto o un servizio. All'interno della macrocategoria del marketing troviamo l'advertising, il quale comprende tutte le trovate legate ai social e, in genere, al metaverso per vendere un prodotto o servizio, perlopiù prodotti audiovisivi come gli spot (come banner pubblicitari, ADV sui social o anche, nel caso di prodotti audiovisivi, clip del prodotto che stiamo vendendo).","correct":"","score":1,"feedback":"Risposta parziale e generica: coglie solo alcuni elementi, con lacune rilevanti. La distinzione va legata soprattutto al fatto che l’advertising è promozione su canali a pagamento, non solo su social/metaverso."},{"idx":6,"text":"1. Che cosa si intende per marketing digitale?","open":false,"options":["A. Una strategia basata esclusivamente sulla pubblicità televisiva","B. L’uso di strumenti digitali per raggiungere i clienti attraverso reti e piattaforme online","C. Una forma di marketing usata solo dalle grandi aziende","D. Una tecnica di vendita diretta porta a porta"],"answer":"B. L’uso di strumenti digitali per raggiungere i clienti attraverso reti e piattaforme online","correct":"B. L’uso di strumenti digitali per raggiungere i clienti attraverso reti e piattaforme online","score":"","feedback":""},{"idx":7,"text":"Qual è definita come la vera ricchezza del XXI secolo?","open":false,"options":["A. L’oro","B. Le informazioni","C. L’energia","D. Il territorio"],"answer":"B. Le informazioni","correct":"B. Le informazioni","score":"","feedback":""},{"idx":8,"text":"Che cosa caratterizza il marketing globale?","open":false,"options":["A. Strategie locali diverse","B. Brand e strategie unificate a livello mondiale","C. Produzione artigianale","D. Assenza di comunicazione"],"answer":"A. Strategie locali diverse","correct":"B. Brand e strategie unificate a livello mondiale","score":"","feedback":""},{"idx":9,"text":"Quale mezzo di comunicazione ha segnato il Novecento insieme alla radio?","open":false,"options":["A. Internet","B. Televisione","C. Cinema","D. Stampa online"],"answer":"C. Cinema","correct":"B. Televisione","score":"","feedback":""},{"idx":10,"text":"Nel romanzo Snow Crash, il metaverso è:","open":false,"options":["A. Un archivio digitale","B. Un mondo virtuale 3D popolato da avatar","C. Un social bidimensionale","D. Un sistema di pagamento"],"answer":"B. Un mondo virtuale 3D popolato da avatar","correct":"B. Un mondo virtuale 3D popolato da avatar","score":"","feedback":""},{"idx":11,"text":"Il termine metaverso indica:","open":false,"options":["A. Un nuovo social network","B. Un universo oltre quello fisico","C. Un software di montaggio","D. Un videogioco specifico"],"answer":"B. Un universo oltre quello fisico","correct":"B. Un universo oltre quello fisico","score":"","feedback":""},{"idx":12,"text":"I social media vengono paragonati nel testo a:","open":false,"options":["A. Biblioteche digitali","B. Agorà e piazze del mercato","C. Studi televisivi","D. Centri commerciali chiusi"],"answer":"A. Biblioteche digitali","correct":"B. Agorà e piazze del mercato","score":"","feedback":""},{"idx":13,"text":"Quale figura professionale è citata come centrale nel Social Media Marketing?","open":false,"options":["A. Il grafico","B. L’influencer","C. Il programmatore","D. Il tipografo"],"answer":"B. L’influencer","correct":"B. L’influencer","score":"","feedback":""},{"idx":14,"text":"Che cosa garantisce la blockchain?","open":false,"options":["A. La velocità di connessione","B. La sicurezza e l’unicità delle transazioni","C. La qualità grafica","D. La compressione dei file"],"answer":"B. La sicurezza e l’unicità delle transazioni","correct":"B. La sicurezza e l’unicità delle transazioni","score":"","feedback":""},{"idx":15,"text":"Qual è la funzione principale del marketing?","open":false,"options":["A. Vendere direttamente un prodotto","B. Identificare i bisogni delle persone e trovare il modo migliore per soddisfarli","C. Creare slogan pubblicitari","D. Gestire solo la comunicazione visiva"],"answer":"B. Identificare i bisogni delle persone e trovare il modo migliore per soddisfarli","correct":"B. Identificare i bisogni delle persone e trovare il modo migliore per soddisfarli","score":"","feedback":""},{"idx":16,"text":"Secondo il testo, quale rischio principale è legato al metaverso?","open":false,"options":["A. Scarsa qualità grafica","B. Raccolta e uso dei dati sensibili","C. Mancanza di utenti","D. Assenza di mercati"],"answer":"B. Raccolta e uso dei dati sensibili","correct":"B. Raccolta e uso dei dati sensibili","score":"","feedback":""},{"idx":17,"text":"Quale tecnologia consente di provare prodotti in modo virtuale?","open":false,"options":["A. Blockchain","B. Realtà aumentata","C. Streaming","D. Peer to peer"],"answer":"B. Realtà aumentata","correct":"B. Realtà aumentata","score":"","feedback":""},{"idx":18,"text":"Secondo il testo, la direzione evolutiva dei social è legata a:","open":false,"options":["A. Riduzione delle interazioni","B. Esperienze immersive e metaverso","C. Ritorno ai media tradizionali","D. Scomparsa del digitale"],"answer":"B. Esperienze immersive e metaverso","correct":"B. Esperienze immersive e metaverso","score":"","feedback":""},{"idx":19,"text":"Un NFT rappresenta:","open":false,"options":["A. L’acquisto fisico di un bene","B. La prova di un diritto su un bene unico","C. Una criptovaluta","D. Un file multimediale"],"answer":"B. La prova di un diritto su un bene unico","correct":"B. La prova di un diritto su un bene unico","score":"","feedback":""},{"idx":20,"text":"Che cosa significa gamification?","open":false,"options":["A. Eliminare il gioco","B. Usare il gioco come leva motivazionale","C. Sostituire il marketing","D. Creare videogiochi"],"answer":"C. Sostituire il marketing","correct":"B. Usare il gioco come leva motivazionale","score":"","feedback":""}];
    const totalPoints = 18;
    const totalMax = 22;
    const voto = 8.2;
    let index = 0;
    const content = document.getElementById("content");
    const mask = document.getElementById("mask");

    function render() {
      if (index >= questions.length) {
        content.innerHTML = `<div class="summary">
          <div class="label">Punteggio ottenuto</div>
          <div><strong>${totalPoints} / ${totalMax}</strong></div>
          <div class="label" style="margin-top:8px;">Voto</div>
          <div><strong>${voto} / 10</strong></div>
        </div>`;
        return;
      }
      const q = questions[index];
      const opts = q.options && q.options.length ? q.options.map(o => '<div class="opt">' + o + '</div>').join("") : "";
      const openBlock = q.open ? `
        <div class="label">Risposta data</div>
        <div>${q.answer || "-"}</div>
        <div class="label">Punteggio</div>
        <div>${q.score || "-"}</div>
        <div class="label">Feedback</div>
        <div>${q.feedback || "-"}</div>` : `
        <div class="label">Risposta data</div>
        <div>${q.answer || "-"}</div>
        <div class="label">Risposta corretta</div>
        <div>${q.correct || "-"}</div>`;
      content.innerHTML = `
        <div class="q-title">${q.idx}. ${q.text}</div>
        ${opts}
        ${openBlock}
      `;
    }
    document.getElementById("prev").addEventListener("click", () => {
      index = Math.max(0, index - 1);
      render();
    });
    document.getElementById("next").addEventListener("click", () => {
      index = Math.min(questions.length, index + 1);
      render();
    });
    document.addEventListener("keydown", (e) => {
      if (e.ctrlKey || e.metaKey) mask.classList.add("hidden");
    });
    document.addEventListener("keyup", (e) => {
      if (!e.ctrlKey && !e.metaKey) mask.classList.remove("hidden");
    });
    render();
  </script>
