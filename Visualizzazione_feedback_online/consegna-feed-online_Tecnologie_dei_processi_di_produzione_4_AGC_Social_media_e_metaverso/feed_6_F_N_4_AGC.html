    const questions = [{"idx":1,"text":"Spiega il funzionamento di base della blockchain.","open":true,"options":[],"answer":"la block chain funziona come una grande rete collegata, dove ogni persona nella block chain ha un blocco, collegato con gli altri, dove è impossibile riuscire ad entrare nel blocco cercando di minare, per il fatto che è richiesto il codice del blocco e il codice del blocco precedente. Se mai qualcuno dovesse modificare l' intero blocco, essendo che le informazioni della block chain sono uguali per tutti e tutti hanno una copia delle vere informazioni, quando un blocco non possiede quelle informazioni viene subito corretto. Le informazioni di riferimento sono sempre quelle dei blocchi in maggioranza. la block chain è sicura per questo per fare transizioni tra gli utenti della block chain. ","correct":"","score":2,"feedback":"Risposta complessivamente corretta: descrive la blockchain come catena di blocchi collegati, con registro condiviso tra i nodi e consenso della maggioranza che rende difficile la manomissione. Mancano però concetti chiave del funzionamento (hash, nonce/proof of work, mining) e la descrizione precisa delle informazioni contenute in ogni blocco."},{"idx":2,"text":"Spiega i rischi e le opportunità del metaverso dal punto di vista sociale ed economico.","open":true,"options":[],"answer":"i rischi sono quelli delle informazioni private come battito cardiaco, sudorazioni ed emozioni che si prova, che vengono registrate ed archiviate. Le opportunità sono di avere un nuovo metodo di comunicazione universale dove tutti possono comprare vendere e comunicare con tutto il mondo come se fossimo fisicamente insieme. Avvantaggia la vendita di prodotti con metodi per esempio utilizzati da Ikea e adidas. permette di essere in un nuovo mondo virtuale in modo, metaforicamente, fisico.","correct":"","score":3,"feedback":"Risposta completa e corretta: individua correttamente il rischio legato alla raccolta di dati sensibili/biometrici e descrive opportunità sociali ed economiche come comunicazione, compravendita e fruizione più immersiva di prodotti e servizi, con esempi pertinenti."},{"idx":3,"text":"Cosa si intende per \"latenza\".","open":true,"options":[],"answer":"la latenza è il tempo che impiega un informazione per trasferirsi e quindi per viaggiare.","correct":"","score":2,"feedback":"Risposta corretta ma troppo sintetica: definisce la latenza come tempo di trasferimento dell’informazione, però manca il riferimento ai tempi di risposta e al contesto di rete."},{"idx":4,"text":"Descrivi che cosa sono gli NFT e il loro possibile utilizzo nel metaverso.","open":true,"options":[],"answer":"gli NFT sono informazioni e codici incondividibili ovvero che non possono essere copiati, i quali appartengono ad un solo possessore e possono essere utilizzati nel metaverso come avatar e identità di una persona nel metaverso.","correct":"","score":2,"feedback":"Risposta parzialmente corretta: coglie l’idea di unicità e dell’uso nel metaverso per identità digitale. Però la definizione è imprecisa (non è “un codice non copiabile” in sé) e mancano le caratteristiche richieste e altri utilizzi tipici nel metaverso."},{"idx":5,"text":"Descrivi il ruolo dei social media nell’evoluzione della comunicazione aziendale.","open":true,"options":[],"answer":"i social media evolvendosi hanno raggiunto un ruolo di scambio binario ovvero dove le persone e quindi i clienti possono scrivere, informarsi e dire la loro su un prodotto o sull'azienda. Per le aziende sono un mezzo di pubblicità dove vengono pubblicizzati e sponsorizzati prodotti e consumi, grazie anche a figure nate sui social come gli influencer. I social media non possono essere considerati posti pubblici dove ognuno dice quello che vuole perchè i social media come quelli di Meta essendo di proprioetà di qualcuno non sono pubbliche.","correct":"","score":3,"feedback":"Risposta completa e corretta: spiega bene la trasformazione verso una comunicazione più bidirezionale in cui i clienti possono interagire e influenzare l’immagine del brand; riconosce l’uso dei social per promozione e sponsorizzazioni e cita correttamente la figura dell’influencer. Corretta anche l’osservazione sulle piattaforme proprietarie."},{"idx":6,"text":"Quale evento ha accelerato l’uso delle piattaforme digitali?","open":false,"options":["A. La crisi economica del 2008","B. La pandemia da Covid-19","C. La nascita dei social","D. L’avvento degli smartphone"],"answer":"B. La pandemia da Covid-19","correct":"B. La pandemia da Covid-19","score":"","feedback":""},{"idx":7,"text":"Con l’avvento di internet, le aziende hanno affiancato ai media tradizionali:","open":false,"options":["A. Solo la televisione satellitare","B. I nuovi media nati con la rete","C. Esclusivamente i videogiochi","D. Unicamente le app proprietarie"],"answer":"B. I nuovi media nati con la rete","correct":"B. I nuovi media nati con la rete","score":"","feedback":""},{"idx":8,"text":"I social media vengono paragonati nel testo a:","open":false,"options":["A. Biblioteche digitali","B. Agorà e piazze del mercato","C. Studi televisivi","D. Centri commerciali chiusi"],"answer":"B. Agorà e piazze del mercato","correct":"B. Agorà e piazze del mercato","score":"","feedback":""},{"idx":9,"text":"Perché le aziende utilizzano i social media nel marketing?","open":false,"options":["A. Perché sono gratuiti","B. Perché gli utenti vi trascorrono molto tempo","C. Perché sostituiscono i prodotti","D. Perché eliminano la concorrenza"],"answer":"A. Perché sono gratuiti","correct":"B. Perché gli utenti vi trascorrono molto tempo","score":"","feedback":""},{"idx":10,"text":"Il marketing sociale utilizza le strategie del marketing per:","open":false,"options":["A. Aumentare solo i profitti","B. Influenzare comportamenti a vantaggio degli individui o della società","C. Eliminare la pubblicità","D. Sostituire le istituzioni"],"answer":"B. Influenzare comportamenti a vantaggio degli individui o della società","correct":"B. Influenzare comportamenti a vantaggio degli individui o della società","score":"","feedback":""},{"idx":11,"text":"Nel marketing relazionale, che ruolo ha l’utente “evangelist”?","open":false,"options":["A. È un dipendente dell’azienda","B. È un cliente che promuove spontaneamente il brand","C. È un influencer pagato","D. È un fornitore"],"answer":"B. È un cliente che promuove spontaneamente il brand","correct":"B. È un cliente che promuove spontaneamente il brand","score":"","feedback":""},{"idx":12,"text":"Secondo il testo, quale rischio principale è legato al metaverso?","open":false,"options":["A. Scarsa qualità grafica","B. Raccolta e uso dei dati sensibili","C. Mancanza di utenti","D. Assenza di mercati"],"answer":"B. Raccolta e uso dei dati sensibili","correct":"B. Raccolta e uso dei dati sensibili","score":"","feedback":""},{"idx":13,"text":"Chi ha usato per primo il termine metaverso nel 1992?","open":false,"options":["A. Philip Kotler","B. Neal Stephenson","C. Mark Zuckerberg","D. Satoshi Nakamoto"],"answer":"B. Neal Stephenson","correct":"B. Neal Stephenson","score":"","feedback":""},{"idx":14,"text":"Quale mezzo di comunicazione ha segnato il Novecento insieme alla radio?","open":false,"options":["A. Internet","B. Televisione","C. Cinema","D. Stampa online"],"answer":"B. Televisione","correct":"B. Televisione","score":"","feedback":""},{"idx":15,"text":"Il marketing relazionale si focalizza soprattutto su:","open":false,"options":["A. Il prezzo","B. Il cliente","C. Il prodotto","D. La distribuzione"],"answer":"B. Il cliente","correct":"B. Il cliente","score":"","feedback":""},{"idx":16,"text":"Che cosa garantisce la blockchain?","open":false,"options":["A. La velocità di connessione","B. La sicurezza e l’unicità delle transazioni","C. La qualità grafica","D. La compressione dei file"],"answer":"B. La sicurezza e l’unicità delle transazioni","correct":"B. La sicurezza e l’unicità delle transazioni","score":"","feedback":""},{"idx":17,"text":"Qual è definita come la vera ricchezza del XXI secolo?","open":false,"options":["A. L’oro","B. Le informazioni","C. L’energia","D. Il territorio"],"answer":"B. Le informazioni","correct":"B. Le informazioni","score":"","feedback":""},{"idx":18,"text":"Il termine metaverso indica:","open":false,"options":["A. Un nuovo social network","B. Un universo oltre quello fisico","C. Un software di montaggio","D. Un videogioco specifico"],"answer":"B. Un universo oltre quello fisico","correct":"B. Un universo oltre quello fisico","score":"","feedback":""},{"idx":19,"text":"Che cosa ha supplito alle attività in presenza durante la pandemia?","open":false,"options":["A. Solo i social network","B. Teleconferenze, didattica a distanza e telelavoro","C. La televisione","D. La stampa"],"answer":"B. Teleconferenze, didattica a distanza e telelavoro","correct":"B. Teleconferenze, didattica a distanza e telelavoro","score":"","feedback":""},{"idx":20,"text":"Secondo il testo, la direzione evolutiva dei social è legata a:","open":false,"options":["A. Riduzione delle interazioni","B. Esperienze immersive e metaverso","C. Ritorno ai media tradizionali","D. Scomparsa del digitale"],"answer":"B. Esperienze immersive e metaverso","correct":"B. Esperienze immersive e metaverso","score":"","feedback":""}];

        ${opts}
        ${openBlock}
      `;
    }
    document.getElementById("prev").addEventListener("click", () => {
      index = Math.max(0, index - 1);
      render();
    });

      index = Math.min(questions.length, index + 1);

      if (e.ctrlKey || e.metaKey) mask.classList.add("hidden");
    });

    });
